<!-- templates/chat/index.html -->
<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Chat index</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #4f46e5, #0ea5e9);
      }

      .container {
        background: #ffffff;
        padding: 32px 28px;
        border-radius: 16px;
        box-shadow: 0 18px 45px rgba(15, 23, 42, 0.25);
        width: 100%;
        max-width: 420px;
      }

      .title {
        font-size: 24px;
        font-weight: 600;
        color: #0f172a;
        margin-bottom: 4px;
        text-align: center;
      }

      .subtitle {
        font-size: 14px;
        color: #64748b;
        margin-bottom: 20px;
        text-align: center;
      }

      .label {
        font-size: 13px;
        font-weight: 500;
        color: #475569;
        margin-bottom: 6px;
        display: block;
      }

      .input-row {
        display: flex;
        gap: 8px;
      }

      #room-name-input {
        flex: 1;
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid #cbd5f5;
        font-size: 14px;
        outline: none;
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
      }

      #room-name-input:focus {
        border-color: #4f46e5;
        box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
      }

      #room-name-submit {
        padding: 10px 18px;
        border-radius: 10px;
        border: none;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        background: #4f46e5;
        color: #ffffff;
        transition: background 0.15s ease, transform 0.1s ease, box-shadow 0.15s ease;
        white-space: nowrap;
      }

      #room-name-submit:hover {
        background: #4338ca;
        box-shadow: 0 8px 18px rgba(79, 70, 229, 0.35);
        transform: translateY(-1px);
      }

      #room-name-submit:active {
        transform: translateY(0);
        box-shadow: none;
      }

      .hint {
        margin-top: 10px;
        font-size: 12px;
        color: #94a3b8;
      }

      .examples {
        margin-top: 14px;
        font-size: 12px;
        color: #64748b;
      }

      .examples span {
        display: inline-block;
        background: #eff6ff;
        color: #1d4ed8;
        padding: 4px 8px;
        border-radius: 999px;
        margin-right: 6px;
        margin-top: 4px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h2 class="title">Welcome to chat</h2>
      <p class="subtitle">Enter a room name to start or join a conversation.</p>

      <label class="label" for="room-name-input">Room name</label>
      <div class="input-row">
        <input
          id="room-name-input"
          type="text"
          placeholder="e.g. general, team, support"
        >
        <button id="room-name-submit">Enter</button>
      </div>

      <p class="hint">Use the same room name in another tab to chat between them.</p>

      <p class="examples">
        Examples:
        <span>general</span>
        <span>test</span>
        <span>project1</span>
      </p>
    </div>

    <script>
      document.querySelector("#room-name-submit").onclick = function () {
        const roomName = document.querySelector("#room-name-input").value.trim();
        if (roomName) {
          window.location.pathname = "/chat/" + roomName + "/";
        }
      };

      document
        .querySelector("#room-name-input")
        .addEventListener("keyup", function (e) {
          if (e.key === "Enter") {
            document.querySelector("#room-name-submit").click();
          }
        });
    </script>
  </body>
</html>
